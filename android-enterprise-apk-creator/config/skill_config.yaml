# Android Enterprise APK Creator - Skill Configuration

skill:
  name: android-enterprise-apk-creator
  version: 1.0.0
  description: Generates complete native Android APKs for enterprise/productivity apps from natural language prompts
  author: Jeremias Enmanuel Ledezma Flores

# Default project settings
defaults:
  package_name: com.company.app
  min_sdk: 24
  target_sdk: 34
  compile_sdk: 34
  kotlin_version: "1.9.20"
  gradle_plugin_version: "8.3.0"
  
  architecture: MVVM + Clean Architecture
  use_jetpack_compose: true
  use_room: true
  use_retrofit: true
  use_hilt: true
  use_workmanager: true
  
  use_encrypted_preferences: true
  use_ssl_pinning: true
  use_proguard: true
  
  include_widgets: true
  include_chatbot: true
  include_offline_sync: true
  
  create_private_repo: true
  repo_visibility: private
  include_ci_cd: false

# Technology stack
tech_stack:
  language: Kotlin
  ui: Jetpack Compose
  database: Room
  networking: Retrofit + OkHttp
  di: Hilt
  background_tasks: WorkManager
  security: AndroidX Security

# Template mappings
templates:
  entity: templates/entity_template.txt
  dao: templates/dao_template.txt
  repository: templates/repository_template.txt
  usecase: templates/usecase_template.txt
  viewmodel: templates/viewmodel_template.txt
  screen: templates/composable_screen_template.txt
  api_service: templates/api_service_template.txt
  readme: templates/README_template.md

# Common data models for enterprise apps
enterprise_models:
  agricultural:
    - name: Crop
      description: Agricultural crop information
      table_name: crops
    - name: Field
      description: Agricultural field information
      table_name: fields
    - name: Expense
      description: Business expense tracking
      table_name: expenses
    - name: Employee
      description: Employee information
      table_name: employees
    - name: Inventory
      description: Inventory item tracking
      table_name: inventory
    - name: Task
      description: Work task management
      table_name: tasks

# Widget configurations
widgets:
  - name: QuickActionsWidget
    description: Widget for quick actions
    size: 2x1
    update_frequency: 1800000
  - name: StatsWidget
    description: Widget showing key statistics
    size: 2x2
    update_frequency: 3600000

# Security configurations
security:
  encrypted_prefs:
    file_name: "secure_prefs"
    key_scheme: AES256_GCM
  ssl_pinning:
    enabled: true
    certificate_file: "certificate.pem"
  proguard:
    enabled: true
    rules_file: "proguard-rules.pro"

# Build configurations
build:
  debug:
    minify_enabled: false
    shrink_resources: false
  release:
    minify_enabled: true
    shrink_resources: true

# GitHub configuration
github:
  default_branch: "main"